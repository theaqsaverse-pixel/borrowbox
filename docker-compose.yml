# Optional: run PostgreSQL in Docker instead of installing it.
#   docker compose up -d
# then use this in server/.env:
#   DATABASE_URL=postgresql://postgres:postgres@localhost:5432/borrowbox
services:
  db:
    image: postgres:16-alpine
    container_name: borrowbox-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: borrowbox
    ports:
      - "5432:5432"
    volumes:
      - borrowbox-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d borrowbox"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  borrowbox-data:
